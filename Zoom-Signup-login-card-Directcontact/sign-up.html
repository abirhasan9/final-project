<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
   
     <!-- breadcum name -->
    <section>
      <div class="container text-center mt-3">
        <h3 class="fw-bold">Sign Up</h3>
        <div class="d-flex justify-content-center align-items-center">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="./index.html">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">
                Sign Up
              </li>
            </ol>
          </nav>
        </div>
      </div>
    </section>
    <!-- sign up -->
    <section>
      <div class="container shadow-lg p-3 rounded-3" style="max-width: 740px;">
        <form class="row g-3" onsubmit="alert('Succesfully Submited')">
          <div class="col-md-6">
            <label for="validationDefault01" class="form-label"
              >First name</label
            >
            <input
              type="text"
              class="form-control"
              id="validationDefault01"
              placeholder="Enter your first name"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="validationDefault02" class="form-label"
              >Last name</label
            >
            <input
              type="text"
              class="form-control"
              id="validationDefault02"
              placeholder="Enter your last name"
              required
            />
          </div>
          <div class="col-md-12">
            <label for="validationDefaultUsername" class="form-label"
              >Username</label
            >
            <div class="input-group">
              <span class="input-group-text" id="inputGroupPrepend2">@</span>
              <input
                type="text"
                class="form-control"
                id="validationDefaultUsername"
                aria-describedby="inputGroupPrepend2"
                required
              />
            </div>
          </div>
          <div class="col-md-12">
            <label for="validationDefault03" class="form-label">E-mail</label>
            <input
              type="email"
              class="form-control"
              id="validationDefault03"
              required
            />
          </div>
       
          <div class="col-md-12">
            <label for="validationDefault05" class="form-label">Phone Number</label>
            <input
              type="number"
              class="form-control"
              id="validationDefault05"
              required
            />
          </div>
           <div class="col-md-12">
            <label for="validationDefault06" class="form-label">Password </label>
            <input
              type="password"
              class="form-control"
              id="validationDefault06"
              required
            />
          </div>
          <div class="col-12">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="invalidCheck2"
                required
              />
              <label class="form-check-label" for="invalidCheck2">
                Agree to terms and conditions
              </label>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-primary w-100" type="submit">Sign Up</button>
          </div>
        </form>
      </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
